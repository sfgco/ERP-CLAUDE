# Deployment pipeline — see docs/DEPLOY.md. Deployed to `staging` by .github/workflows/deploy.yml after CI passes on
# `main`, or by hand with `npx serverless deploy --stage staging`. Never deploy `prod` from a laptop (CLAUDE.md).
# Requires: the SSM parameters under /eayni/<stage>/ listed in docs/DEPLOY.md and a Serverless Framework access key
# for the `eayni` org (SERVERLESS_ACCESS_KEY). Open items remain in docs/DECISIONS.md §1 (region, data residency, SES).
org: eayni
# "app" enables Serverless Framework Dashboard features and sharing them with other Services.
app: eayni-backend
# Stack, buckets and function names derive from this: eayni-system-<stage>, eayni-system-<stage>-files/-web.
# scripts/stage-env.sh must keep the same value.
service: eayni-system
frameworkVersion: '4'

custom:
  # Optional custom domain for the web + API distribution (DECISIONS §1 item 3). Leave the parameters absent to use
  # the *.cloudfront.net domain. When set: `web-domain` = host name (e.g. system.eayni.info), `web-certificate-arn` =
  # an ACM certificate in us-east-1 covering it, `hosted-zone-id` (optional) = the Route 53 zone to write the alias
  # records into. `app-url` must then be https://<web-domain>.
  webDomain: ${ssm:/eayni/${self:provider.stage}/web-domain, ''}
  webCertificateArn: ${ssm:/eayni/${self:provider.stage}/web-certificate-arn, ''}
  hostedZoneId: ${ssm:/eayni/${self:provider.stage}/hosted-zone-id, ''}

provider:
  name: aws
  runtime: nodejs22.x
  region: ${opt:region, 'me-south-1'}
  stage: ${opt:stage, 'staging'}
  memorySize: 1024
  timeout: 29
  architecture: arm64
  environment:
    NODE_ENV: production
    STAGE: ${self:provider.stage}
    MONGODB_URI: ${ssm:/eayni/${self:provider.stage}/mongodb-uri}
    APP_SECRET: ${ssm:/eayni/${self:provider.stage}/app-secret}
    FILE_STORAGE: s3
    S3_BUCKET: ${self:service}-${self:provider.stage}-files
    # The CloudFront origin below (or the custom domain pointed at it): web and API share this origin,
    # so the SameSite=Lax session cookie and relative /api/v1 calls work (review F2).
    APP_URL: ${ssm:/eayni/${self:provider.stage}/app-url}
    COOKIE_SECURE: 'true'
    # Requests must come through CloudFront (follow-up 2): the distribution adds this secret origin header and the
    # API rejects anything without it; the client IP is read from CloudFront-Viewer-Address, not from X-Forwarded-For.
    ORIGIN_SECRET: ${ssm:/eayni/${self:provider.stage}/origin-secret}
    # Accepted during a rotation while CloudFront propagates the new header (empty when not rotating).
    ORIGIN_SECRET_PREVIOUS: ${ssm:/eayni/${self:provider.stage}/origin-secret-previous, ''}
    TRUST_PROXY_HOPS: '0'
  iam:
    role:
      statements:
        - Effect: Allow
          Action: [s3:PutObject, s3:GetObject, s3:DeleteObject]
          Resource: arn:aws:s3:::${self:service}-${self:provider.stage}-files/*
        - Effect: Allow
          Action: [ses:SendEmail, ses:SendRawEmail]
          Resource: '*'

package:
  individually: true

functions:
  api:
    handler: apps/api/src/handlers/api.handler
    events:
      - httpApi: '*'
  outbox:
    handler: apps/api/src/handlers/outbox.handler
    timeout: 120
    events:
      - schedule: rate(1 minute)
  # One-off operations (staging readiness 1 and 3). Invoke by hand, never scheduled:
  #   npx serverless invoke -f bootstrap --stage staging --data '{"adminEmail":"you@eayni.local"}'
  #   npx serverless invoke -f seedStagingDemo --stage staging      (refused unless STAGE=staging)
  #   npx serverless invoke -f purgeDemo --stage staging
  bootstrap:
    handler: apps/api/src/handlers/bootstrap.handler
    timeout: 120
  seedStagingDemo:
    handler: apps/api/src/handlers/bootstrap.seedDemoHandler
    timeout: 300
  purgeDemo:
    handler: apps/api/src/handlers/bootstrap.purgeDemoHandler
    timeout: 300
  jobs:
    handler: apps/api/src/handlers/jobs.handler
    timeout: 300
    events:
      # Review F3: two cadences. Frequent (reminders, news windows, task due/overdue, account deactivation,
      # ticket follow-ups) every 5 minutes; daily (birthdays, expiry alerts, overdue digests, queue reminders) at 06:00 Riyadh.
      - schedule:
          rate: rate(5 minutes)
          input: { cadence: frequent }
      - schedule:
          rate: cron(0 3 * * ? *)
          input: { cadence: daily }

resources:
  Conditions:
    HasWebDomain:
      Fn::Not: [{ Fn::Equals: ['${self:custom.webDomain}', ''] }]
    HasWebDns:
      Fn::And:
        - { Condition: HasWebDomain }
        - { Fn::Not: [{ Fn::Equals: ['${self:custom.hostedZoneId}', ''] }] }
  Resources:
    FilesBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:service}-${self:provider.stage}-files
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        CorsConfiguration:
          CorsRules:
            - AllowedMethods: [PUT, GET]
              # Only the web app origin may talk to the bucket (review C15); presigned URLs carry the auth.
              AllowedOrigins:
                - ${ssm:/eayni/${self:provider.stage}/app-url}
              AllowedHeaders: [Content-Type, Content-Length]
              MaxAge: 3000

    # ---- Web hosting (review F2): private S3 bucket behind CloudFront (OAC); /api/* goes to the HTTP API ----
    WebBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:service}-${self:provider.stage}-web
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
    WebOriginAccessControl:
      Type: AWS::CloudFront::OriginAccessControl
      Properties:
        OriginAccessControlConfig:
          Name: ${self:service}-${self:provider.stage}-web-oac
          OriginAccessControlOriginType: s3
          SigningBehavior: always
          SigningProtocol: sigv4
    WebBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref WebBucket
        PolicyDocument:
          Statement:
            - Effect: Allow
              Principal: { Service: cloudfront.amazonaws.com }
              Action: s3:GetObject
              Resource: !Sub '${WebBucket.Arn}/*'
              Condition:
                StringEquals:
                  AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}'
    WebDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Enabled: true
          Comment: ${self:service} ${self:provider.stage} — web + /api
          HttpVersion: http2and3
          DefaultRootObject: index.html
          PriceClass: PriceClass_200
          # Custom domain + ACM certificate (us-east-1) when the SSM parameters in `custom` are set (long-form
          # intrinsics so apps/api/src/core/golive-followup.test.ts can still parse this file).
          Aliases:
            Fn::If: [HasWebDomain, ['${self:custom.webDomain}'], { Ref: 'AWS::NoValue' }]
          ViewerCertificate:
            Fn::If:
              - HasWebDomain
              - AcmCertificateArn: ${self:custom.webCertificateArn}
                SslSupportMethod: sni-only
                MinimumProtocolVersion: TLSv1.2_2021
              - CloudFrontDefaultCertificate: true
          Origins:
            - Id: web
              DomainName: !GetAtt WebBucket.RegionalDomainName
              OriginAccessControlId: !GetAtt WebOriginAccessControl.Id
              S3OriginConfig: { OriginAccessIdentity: '' }
            - Id: api
              DomainName: !Select [1, !Split ['//', !GetAtt HttpApi.ApiEndpoint]]
              CustomOriginConfig:
                OriginProtocolPolicy: https-only
                OriginSSLProtocols: [TLSv1.2]
              # Proof the request came through CloudFront (go-live follow-up 2); the API rejects requests without it.
              OriginCustomHeaders:
                - HeaderName: x-origin-secret
                  HeaderValue: ${ssm:/eayni/${self:provider.stage}/origin-secret}
          DefaultCacheBehavior:
            TargetOriginId: web
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
            # SPA fallback (follow-up 1): paths without a file extension are rewritten to /index.html on the web
            # behaviour only, so /api/* keeps its real 403/404 status codes and bodies.
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt WebSpaRewriteFunction.FunctionARN
          CacheBehaviors:
            - PathPattern: /api/*
              TargetOriginId: api
              ViewerProtocolPolicy: https-only
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
              CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
              # Managed-AllViewerExceptHostHeader (follow-up 2 of fffae18): made for API Gateway origins — forwards cookies,
              # query strings and all viewer headers except Host, plus the CloudFront viewer headers incl. CloudFront-Viewer-Address.
              OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
    WebSpaRewriteFunction:
      Type: AWS::CloudFront::Function
      Properties:
        Name: ${self:service}-${self:provider.stage}-spa-rewrite
        AutoPublish: true
        FunctionConfig:
          Comment: SPA routes (no file extension) → /index.html; attached to the web behaviour only
          Runtime: cloudfront-js-2.0
        FunctionCode: |
          function handler(event) {
            var request = event.request;
            var uri = request.uri;
            if (uri.startsWith('/api/')) return request;
            var last = uri.substring(uri.lastIndexOf('/') + 1);
            if (last.indexOf('.') === -1) request.uri = '/index.html';
            return request;
          }
    # Route 53 alias records for the custom domain (only when hosted-zone-id is set). Z2FDTNDATAQYW2 is the fixed
    # hosted zone id of every CloudFront distribution.
    WebDnsRecordA:
      Type: AWS::Route53::RecordSet
      Condition: HasWebDns
      Properties:
        HostedZoneId: ${self:custom.hostedZoneId}
        Name: ${self:custom.webDomain}
        Type: A
        AliasTarget:
          DNSName: !GetAtt WebDistribution.DomainName
          HostedZoneId: Z2FDTNDATAQYW2
    WebDnsRecordAAAA:
      Type: AWS::Route53::RecordSet
      Condition: HasWebDns
      Properties:
        HostedZoneId: ${self:custom.hostedZoneId}
        Name: ${self:custom.webDomain}
        Type: AAAA
        AliasTarget:
          DNSName: !GetAtt WebDistribution.DomainName
          HostedZoneId: Z2FDTNDATAQYW2
  Outputs:
    WebBucketName:
      Value: !Ref WebBucket
    WebDistributionId:
      Value: !Ref WebDistribution
    WebDistributionDomain:
      Value: !GetAtt WebDistribution.DomainName
    WebUrl:
      Value:
        Fn::If:
          [
            HasWebDomain,
            'https://${self:custom.webDomain}',
            { Fn::Join: ['', ['https://', !GetAtt WebDistribution.DomainName]] },
          ]
      Description: Public URL of the web app; /eayni/<stage>/app-url must equal this value
    # HttpApiUrl (the execute-api URL) is emitted by the framework itself for httpApi events; declaring it here too
    # merges two Value forms into one map and CloudFormation rejects the template.

build:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node22
    # apps/api is ESM ("type": "module") but the root package.json, which the bundler ships, is not: the bundle must be
    # emitted as .mjs or Lambda loads it as CommonJS and fails on the first `import`.
    format: esm
    outExtension:
      '.js': '.mjs'
    # createRequire banner for the CommonJS dependencies inside the ESM bundle — see esbuild.config.mjs.
    configFile: esbuild.config.mjs
