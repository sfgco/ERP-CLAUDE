name: CI

on:
  push:
    branches: [main, deploy-aws]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
        env:
          CI: 'true'
      - run: npm run build -w apps/web

  # Staging deploy lives in deploy.yml: it is triggered by `workflow_run` when this workflow succeeds on `main`.
  # Never deploy to prod from a workflow or a laptop (CLAUDE.md).
